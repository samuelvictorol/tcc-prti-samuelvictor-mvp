server {
  listen ${PORT};
  listen [::]:${PORT};
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Uploads de cabecalho para templates (imagem, video e documento) passam
  # pelo proxy antes de serem persistidos no GridFS da API.
  client_max_body_size 105m;

  # O entrypoint oficial lê os nameservers de /etc/resolv.conf. Usar uma
  # variável no proxy_pass adia a resolução do upstream para cada janela DNS,
  # evitando que o Nginx encerre quando o DNS privado ainda não propagou.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
  resolver_timeout 5s;
  set $api_upstream "${API_UPSTREAM}";

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # POST /api/media nao pode cair no redirecionamento automatico que o Nginx
  # cria para locations terminadas em /. No Render esse redirect revelava a
  # porta HTTP interna (10000), mudava a origem publica e era bloqueado pelo CSP.
  location = /api/media {
    access_log off;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # A URL assinada e uma capability de leitura; nao grave o token permanente
  # nos access logs do proxy. Timeouts maiores cobrem uploads de documentos.
  location ^~ /api/media/ {
    access_log off;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  # ^~ impede que URLs de midia da API terminadas em .jpg/.mp4/.pdf sejam
  # capturadas pela regra de arquivos estaticos do frontend.
  location ^~ /api/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location /socket.io/ {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location ~* \.(?:js|css|woff2?|png|jpe?g|gif|ico|webp)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
