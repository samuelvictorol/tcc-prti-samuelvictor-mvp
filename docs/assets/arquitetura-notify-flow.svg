<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do Notify App</title>
  <desc id="desc">Fluxo entre navegador, frontend, API, MongoDB, Redis e provedores de comunicação.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F8F7A"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B2E2B" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:700 44px Arial,sans-serif;fill:#0B2E2B}.subtitle{font:400 23px Arial,sans-serif;fill:#47645F}
      .h{font:700 26px Arial,sans-serif;fill:#0B2E2B}.p{font:400 20px Arial,sans-serif;fill:#47645F}
      .pill{font:700 17px Arial,sans-serif;fill:#0F8F7A}.line{stroke:#0F8F7A;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7FBFA"/>
  <text x="90" y="82" class="title">Arquitetura em camadas</text>
  <text x="90" y="120" class="subtitle">REST para comandos, webhooks para entrada e Socket.IO para atualização visual em tempo real.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="250" width="260" height="250" rx="34" fill="#FFFFFF" stroke="#BFE9DF" stroke-width="3"/>
    <circle cx="220" cy="315" r="38" fill="#DDF7F1"/>
    <path d="M195 323h50M202 306h36M205 338h30" stroke="#0F8F7A" stroke-width="7" stroke-linecap="round"/>
    <text x="220" y="395" text-anchor="middle" class="h">Navegador</text>
    <text x="220" y="432" text-anchor="middle" class="p">Admin e Meu perfil</text>
    <text x="220" y="466" text-anchor="middle" class="pill">HTTPS · WSS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="465" y="205" width="300" height="340" rx="34" fill="#FFFFFF" stroke="#BFE9DF" stroke-width="3"/>
    <rect x="510" y="255" width="210" height="118" rx="18" fill="#DDF7F1"/>
    <path d="M535 330l44-45 43 38 35-28 39 35" fill="none" stroke="#0F8F7A" stroke-width="7" stroke-linecap="round"/>
    <text x="615" y="421" text-anchor="middle" class="h">Frontend</text>
    <text x="615" y="458" text-anchor="middle" class="p">Vue · Quasar · Pinia</text>
    <text x="615" y="493" text-anchor="middle" class="pill">Nginx · SPA · proxy</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="880" y="150" width="330" height="450" rx="34" fill="#0B2E2B"/>
    <text x="1045" y="215" text-anchor="middle" style="font:700 28px Arial,sans-serif;fill:#FFFFFF">API e regras</text>
    <rect x="930" y="255" width="230" height="65" rx="16" fill="#DDF7F1"/>
    <text x="1045" y="296" text-anchor="middle" class="h">Express + Zod</text>
    <rect x="930" y="345" width="230" height="65" rx="16" fill="#DDF7F1"/>
    <text x="1045" y="386" text-anchor="middle" class="h">Managers</text>
    <rect x="930" y="435" width="230" height="65" rx="16" fill="#DDF7F1"/>
    <text x="1045" y="476" text-anchor="middle" class="h">Socket.IO</text>
    <text x="1045" y="545" text-anchor="middle" style="font:700 18px Arial,sans-serif;fill:#8BE6D2">Autorização · dedupe · logs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1290" y="120" width="230" height="145" rx="28" fill="#FFFFFF" stroke="#BFE9DF" stroke-width="3"/>
    <text x="1405" y="177" text-anchor="middle" class="h">MongoDB</text>
    <text x="1405" y="215" text-anchor="middle" class="p">Dados e auditoria</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1290" y="315" width="230" height="145" rx="28" fill="#FFFFFF" stroke="#BFE9DF" stroke-width="3"/>
    <text x="1405" y="372" text-anchor="middle" class="h">Redis</text>
    <text x="1405" y="410" text-anchor="middle" class="p">BullMQ · locks</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1290" y="510" width="230" height="250" rx="28" fill="#FFFFFF" stroke="#BFE9DF" stroke-width="3"/>
    <text x="1405" y="565" text-anchor="middle" class="h">Provedores</text>
    <rect x="1325" y="598" width="160" height="38" rx="19" fill="#DDF7F1"/><text x="1405" y="623" text-anchor="middle" class="pill">WhatsApp Cloud</text>
    <rect x="1325" y="650" width="160" height="38" rx="19" fill="#DDF7F1"/><text x="1405" y="675" text-anchor="middle" class="pill">Telegram</text>
    <rect x="1325" y="702" width="160" height="38" rx="19" fill="#DDF7F1"/><text x="1405" y="727" text-anchor="middle" class="pill">Gmail</text>
  </g>

  <path class="line" d="M350 375H450"/><text x="400" y="352" text-anchor="middle" class="pill">UI</text>
  <path class="line" d="M765 375H865"/><text x="815" y="352" text-anchor="middle" class="pill">REST / WS</text>
  <path class="line" d="M1210 235H1275"/>
  <path class="line" d="M1210 385H1275"/>
  <path class="line" d="M1210 535C1250 535 1250 635 1275 635"/>

  <rect x="90" y="690" width="1080" height="120" rx="26" fill="#DDF7F1"/>
  <text x="125" y="738" class="h">Entrada assíncrona</text>
  <text x="125" y="780" class="p">Meta e Telegram chamam webhooks HTTPS → a API persiste, atualiza filas e publica eventos no painel.</text>
</svg>
